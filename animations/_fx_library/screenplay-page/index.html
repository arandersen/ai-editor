<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>@screenplay-page — Courier Screenplay Page Slide-In + Yellow Highlighter Sweep</title>
  <script src="vendor/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: transparent;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
    }
    #stage {
      width: 1080px;
      height: 1920px;
      position: relative;
      overflow: hidden;
    }

      .sp-page { position: absolute; top: 0; bottom: 0; left: 0; width: 66%; background: #F0EADE; color: #141413; font-family: 'Courier New', Courier, monospace; padding: 380px 56px 120px; box-shadow: 24px 0 64px rgba(0,0,0,0.65); }
      .sp-slug { font-size: 30px; font-weight: 700; margin-bottom: 48px; }
      .sp-char { font-size: 30px; font-weight: 700; text-align: center; }
      .sp-par { font-size: 28px; text-align: center; margin-bottom: 18px; }
      .sp-dia { font-size: 32px; line-height: 1.42; margin-bottom: 48px; }
      .muted { opacity: 0.42; }
      .sp-hl-wrap { position: relative; display: inline-block; }
      .sp-hl { position: absolute; inset: 0 -6px; background: #F6E478; z-index: 0; transform-origin: left center; transform: scaleX(0); }
      .sp-hl-wrap b { position: relative; z-index: 1; }
      .sp-cut { font-size: 28px; text-align: right; opacity: 0.65; }
  </style>
</head>
<body>
  <div id="stage"
       data-composition-id="main"
       data-composition
       data-start="0"
       data-width="1080"
       data-height="1920"
       data-fps="60"
       data-duration="1.8"
       data-composition-variables='[{"id": "slugline", "type": "string", "label": "slugline", "default": "INT. GREEN ROOM - DAY"}, {"id": "character", "type": "string", "label": "character", "default": "JUSTYN"}, {"id": "parenthetical", "type": "string", "label": "parenthetical", "default": "(to camera)"}, {"id": "highlightedLine", "type": "string", "label": "highlightedLine", "default": "Screenplay page."}]'>

      <div class="sp-page" id="spp">
        <div class="sp-slug">INT. GREEN ROOM - DAY</div>
        <div class="sp-char">JUSTYN</div>
        <div class="sp-par">(to camera)</div>
        <div class="sp-dia">
          <span class="muted">Film look. Jiggle delete.</span><br/>
          <span class="sp-hl-wrap"><span class="sp-hl" id="sphl"></span><b>Screenplay page.</b></span><br/>
          <span class="muted">Grid collapse.</span>
        </div>
        <div class="sp-cut">CUT TO:</div>
      </div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const vars = (window.__hyperframes && typeof window.__hyperframes.getVariables === 'function')
      ? window.__hyperframes.getVariables()
      : {"slugline": "INT. GREEN ROOM - DAY", "character": "JUSTYN", "parenthetical": "(to camera)", "highlightedLine": "Screenplay page."};

    function text(selector, value) {
      document.querySelectorAll(selector).forEach(el => {
        el.textContent = String(value ?? ''); el.style.whiteSpace = 'pre-line';
      });
    }
    function style(selector, values) {
      document.querySelectorAll(selector).forEach(el => Object.assign(el.style, values));
    }
    function items(selector, values, tag, cls) {
      const parent = document.querySelector(selector); if (!parent) return;
      parent.replaceChildren(...values.map(value => {
        const el = document.createElement(tag); el.className = cls;
        el.textContent = String(value); return el;
      }));
    }
    function media(selector, value) {
      if (!value || value.startsWith('@')) return;
      document.querySelectorAll(selector).forEach(parent => {
        parent.style.position ||= 'relative';
        const video = /\.(mp4|mov|webm)(?:\?|$)/i.test(value);
        const el = document.createElement(video ? 'video' : 'img');
        el.src = value; el.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;';
        if (video) { el.muted = true; el.setAttribute('playsinline',''); el.dataset.start='0'; el.dataset.duration=document.querySelector('#stage').dataset.duration; }
        if (parent.id==='stage') parent.prepend(el); else parent.replaceChildren(el);
      });
    }
    function foreground(value) {
      if (!value || value.startsWith('@')) return;
      let parent = document.getElementById('subject-layer');
      if (!parent) { parent = document.createElement('div'); parent.id='subject-layer';
        parent.style.cssText='position:absolute;inset:0;pointer-events:none;z-index:2;';
        document.getElementById('stage').append(parent); }
      media('#subject-layer', value);
    }
    Object.keys(vars).forEach(key => {
      if (typeof vars[key] === 'string' && /^[\[{]/.test(vars[key])) {
        try { vars[key] = JSON.parse(vars[key]); } catch (_) {}
      }
    });
text('.sp-slug',vars.slugline);text('.sp-char',vars.character);text('.sp-par',vars.parenthetical);text('.sp-hl-wrap b',vars.highlightedLine);
    const tl = gsap.timeline({ paused: true });

      tl.fromTo('#spp', { x: '-100%' }, { x: '0%', duration: 0.28, ease: 'power3.out' }, 0.0)
        .to('#sphl', { scaleX: 1, duration: 0.35, ease: 'power2.out' }, 0.28);

    window.__timelines["main"] = tl;
    window.__hyperframes_timeline = tl;
  </script>
</body>
</html>
