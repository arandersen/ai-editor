<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>@before-after — Vertical Light-Leak Split Wipe + Before/After Frosted Badges</title>
  <script src="vendor/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: transparent;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
    }
    #stage {
      width: 1080px;
      height: 1920px;
      position: relative;
      overflow: hidden;
    }

      .ba-pill { position: absolute; top: 56%; padding: 14px 32px; border-radius: 999px; background: rgba(20,20,22,0.72); border: 2px solid rgba(255,255,255,0.22); color: #FFFFFF; font-size: 34px; font-weight: 700; opacity: 0; }
      .ba-left { left: 8%; }
      .ba-right { right: 8%; color: #F6E478; }
      .ba-beam { position: absolute; top: 0; bottom: 0; left: 0; width: 14px; background: #FFFDF5; box-shadow: 0 0 48px 24px rgba(246, 228, 120, 0.85), 0 0 110px 48px rgba(255, 255, 255, 0.55); }
  </style>
</head>
<body>
  <div id="stage"
       data-composition-id="main"
       data-composition
       data-start="0"
       data-width="1080"
       data-height="1920"
       data-fps="60"
       data-duration="2.0"
       data-composition-variables='[{"id": "leftLabel", "type": "string", "label": "leftLabel", "default": "before"}, {"id": "rightLabel", "type": "string", "label": "rightLabel", "default": "\u2022 after"}, {"id": "beamColor", "type": "string", "label": "beamColor", "default": "#FFF7D6"}]'>

      <div class="ba-pill ba-left" id="bal">before</div>
      <div class="ba-pill ba-right" id="bar">• after</div>
      <div class="ba-beam" id="beam"></div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const vars = (window.__hyperframes && typeof window.__hyperframes.getVariables === 'function')
      ? window.__hyperframes.getVariables()
      : {"leftLabel": "before", "rightLabel": "\u2022 after", "beamColor": "#FFF7D6"};

    function text(selector, value) {
      document.querySelectorAll(selector).forEach(el => {
        el.textContent = String(value ?? ''); el.style.whiteSpace = 'pre-line';
      });
    }
    function style(selector, values) {
      document.querySelectorAll(selector).forEach(el => Object.assign(el.style, values));
    }
    function items(selector, values, tag, cls) {
      const parent = document.querySelector(selector); if (!parent) return;
      parent.replaceChildren(...values.map(value => {
        const el = document.createElement(tag); el.className = cls;
        el.textContent = String(value); return el;
      }));
    }
    function media(selector, value) {
      if (!value || value.startsWith('@')) return;
      document.querySelectorAll(selector).forEach(parent => {
        parent.style.position ||= 'relative';
        const video = /\.(mp4|mov|webm)(?:\?|$)/i.test(value);
        const el = document.createElement(video ? 'video' : 'img');
        el.src = value; el.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;';
        if (video) { el.muted = true; el.setAttribute('playsinline',''); el.dataset.start='0'; el.dataset.duration=document.querySelector('#stage').dataset.duration; }
        if (parent.id==='stage') parent.prepend(el); else parent.replaceChildren(el);
      });
    }
    function foreground(value) {
      if (!value || value.startsWith('@')) return;
      let parent = document.getElementById('subject-layer');
      if (!parent) { parent = document.createElement('div'); parent.id='subject-layer';
        parent.style.cssText='position:absolute;inset:0;pointer-events:none;z-index:2;';
        document.getElementById('stage').append(parent); }
      media('#subject-layer', value);
    }
    Object.keys(vars).forEach(key => {
      if (typeof vars[key] === 'string' && /^[\[{]/.test(vars[key])) {
        try { vars[key] = JSON.parse(vars[key]); } catch (_) {}
      }
    });
text('#bal',vars.leftLabel);text('#bar',vars.rightLabel);style('#beam',{background:vars.beamColor});
    const tl = gsap.timeline({ paused: true });

      tl.to('#bal', { opacity: 1, duration: 0.2 }, 0.05)
        .fromTo('#beam', { x: 40 }, { x: 1020, duration: 1.35, ease: 'power2.inOut' }, 0.1)
        .to('#bar', { opacity: 1, duration: 0.25 }, 0.65);

    window.__timelines["main"] = tl;
    window.__hyperframes_timeline = tl;
  </script>
</body>
</html>
