<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>@phone-mockup — 3D Tilted iPhone Mockup Slide-In + Scrolling Screen Capture</title>
  <script src="vendor/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: transparent;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      color: #FFFFFF;
    }
    #stage {
      width: 1080px;
      height: 1920px;
      position: relative;
      overflow: hidden;
    }

      .phone-stage { position: absolute; left: 5%; top: 30%; width: 38%; height: 46%; perspective: 1400px; }
      .phone-card { width: 100%; height: 100%; background: #141417; border: 12px solid #3F3F46; border-radius: 72px; padding: 22px; box-shadow: 0 36px 80px rgba(0,0,0,0.75); position: relative; overflow: hidden; opacity: 0; }
      .island { width: 34%; height: 34px; background: #000; border-radius: 20px; margin: 8px auto 18px; }
      .screen-Viewport { width: 100%; height: 88%; border-radius: 48px; overflow: hidden; background: #0B0C10; }
      .screen-scroll { display: flex; flex-direction: column; gap: 28px; padding: 28px; }
      .poster-block { background: linear-gradient(145deg, #7C2D12, #090A0F); border-radius: 32px; padding: 44px 28px; color: #FFF; }
      .poster-title { font-size: 54px; font-weight: 900; line-height: 1.02; margin-bottom: 28px; }
      .poster-cta { display: inline-block; background: #EA580C; padding: 14px 26px; border-radius: 16px; font-size: 24px; font-weight: 800; }
      .article-block { background: #F8FAFC; color: #0F172A; border-radius: 32px; padding: 36px 28px; }
      .art-h { font-size: 40px; font-weight: 800; margin-bottom: 12px; }
      .art-p { font-size: 28px; line-height: 1.35; color: #334155; }
  </style>
</head>
<body>
  <div id="stage"
       data-composition-id="main"
       data-composition
       data-start="0"
       data-width="1080"
       data-height="1920"
       data-fps="60"
       data-duration="2.4"
       data-composition-variables='[{"id": "deviceFrame", "type": "string", "label": "deviceFrame", "default": "@asset/mockups/devices/iphone_16_pro_frame.svg"}, {"id": "screenAsset", "type": "string", "label": "screenAsset", "default": "@asset/photo/screenshots/app_feed.png"}, {"id": "headline", "type": "string", "label": "headline", "default": "YOU FILM.\nCLAUDE EDITS."}, {"id": "xPercent", "type": "number", "label": "xPercent", "default": 20.0}, {"id": "yPercent", "type": "number", "label": "yPercent", "default": 50.0}]'>

      <div class="phone-stage">
        <div class="phone-card" id="ph">
          <div class="island"></div>
          <div class="screen-Viewport">
            <div class="screen-scroll" id="scr">
              <div class="poster-block">
                <div class="poster-title">YOU FILM.<br/>CLAUDE EDITS.</div>
                <div class="poster-cta">TRY IT NOW</div>
              </div>
              <div class="article-block">
                <div class="art-h">Automated 4K Timeline</div>
                <div class="art-p">Every pause, jump cut, and motion graphic synced to 10ms RMS onset.</div>
              </div>
            </div>
          </div>
        </div>
      </div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const vars = (window.__hyperframes && typeof window.__hyperframes.getVariables === 'function')
      ? window.__hyperframes.getVariables()
      : {"deviceFrame": "@asset/mockups/devices/iphone_16_pro_frame.svg", "screenAsset": "@asset/photo/screenshots/app_feed.png", "headline": "YOU FILM.\nCLAUDE EDITS.", "xPercent": 20.0, "yPercent": 50.0};

    function text(selector, value) {
      document.querySelectorAll(selector).forEach(el => {
        el.textContent = String(value ?? ''); el.style.whiteSpace = 'pre-line';
      });
    }
    function style(selector, values) {
      document.querySelectorAll(selector).forEach(el => Object.assign(el.style, values));
    }
    function items(selector, values, tag, cls) {
      const parent = document.querySelector(selector); if (!parent) return;
      parent.replaceChildren(...values.map(value => {
        const el = document.createElement(tag); el.className = cls;
        el.textContent = String(value); return el;
      }));
    }
    function media(selector, value) {
      if (!value || value.startsWith('@')) return;
      document.querySelectorAll(selector).forEach(parent => {
        parent.style.position ||= 'relative';
        const video = /\.(mp4|mov|webm)(?:\?|$)/i.test(value);
        const el = document.createElement(video ? 'video' : 'img');
        el.src = value; el.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;';
        if (video) { el.muted = true; el.setAttribute('playsinline',''); el.dataset.start='0'; el.dataset.duration=document.querySelector('#stage').dataset.duration; }
        if (parent.id==='stage') parent.prepend(el); else parent.replaceChildren(el);
      });
    }
    function foreground(value) {
      if (!value || value.startsWith('@')) return;
      let parent = document.getElementById('subject-layer');
      if (!parent) { parent = document.createElement('div'); parent.id='subject-layer';
        parent.style.cssText='position:absolute;inset:0;pointer-events:none;z-index:2;';
        document.getElementById('stage').append(parent); }
      media('#subject-layer', value);
    }
    Object.keys(vars).forEach(key => {
      if (typeof vars[key] === 'string' && /^[\[{]/.test(vars[key])) {
        try { vars[key] = JSON.parse(vars[key]); } catch (_) {}
      }
    });
media('.screen-Viewport',vars.screenAsset);text('.poster-title',vars.headline);style('.phone-stage',{left:vars.xPercent+'%',top:vars.yPercent+'%'});if(!vars.deviceFrame.startsWith('@'))style('.phone-card',{backgroundImage:'url('+vars.deviceFrame+')',backgroundSize:'100% 100%'});
    const tl = gsap.timeline({ paused: true });

      tl.fromTo('#ph', { opacity: 0, x: -160, rotateY: 28, rotateZ: -8, scale: 0.86 }, { opacity: 1, x: 0, rotateY: 14, rotateZ: -4, scale: 1, duration: 0.42, ease: 'back.out(1.4)' }, 0.0)
        .to('#scr', { y: -260, duration: 1.4, ease: 'power2.inOut' }, 0.55);

    window.__timelines["main"] = tl;
    window.__hyperframes_timeline = tl;
  </script>
</body>
</html>
